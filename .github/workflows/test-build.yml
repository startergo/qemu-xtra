name: Test Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'openglide/**'

jobs:
  test-build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential autotools-dev automake libtool 
        sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxext-dev libxxf86vm-dev
        sudo apt-get install -y pkg-config

    - name: Run bootstrap
      run: |
        cd openglide
        chmod +x bootstrap
        ./bootstrap

    - name: Create build directory
      run: mkdir -p build

    - name: Configure
      run: |
        cd build
        ../openglide/configure --disable-sdl

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Verify build outputs
      run: |
        cd build
        ls -la .libs/
        file .libs/libglide2x.so* || echo "libglide2x.so not found"
        file .libs/libglide3x.so* || echo "libglide3x.so not found"
        
    - name: Test library linkage
      run: |
        cd build
        ldd .libs/libglide2x.so.0.0.0 || echo "Could not check libglide2x linkage"
        ldd .libs/libglide3x.so.0.0.0 || echo "Could not check libglide3x linkage"